server {
    listen       80;
    server_name  tesseract.schrodingers.cat;
    
    # Root remains at the base. Nginx appends the full request path.
    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip
    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # 1. ASSET CACHING (Scoped)
    # Matches /apps/cloud-console/assets/main-Xy9z.js etc
    location ~* ^/apps/cloud-console/.*\.(?:css|js|gif|jpeg|jpg|png|svg|ico|woff|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, s-maxage=31536000, immutable";
        access_log off;
        log_not_found off;
        tcp_nodelay on;
    }

    # 2. SPA FALLBACK (Scoped)
    # Matches /apps/cloud-console/resource/123 -> Serves index.html from where client router takes over
    location /apps/cloud-console {
        try_files $uri $uri/ /apps/cloud-console/index.html;
    }
}